<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Menuju Booth</title>
<style>
  :root{
    --blue:#5170ff;
    --beige:#fff1d1;
    --ink:#2b2b3d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#ffffff; color:var(--ink);
    font-family: Arial, "Segoe UI", sans-serif;
    display:flex; justify-content:center;
  }
  .wrap{ width:100%; max-width:480px; padding:20px 16px 40px; }

  .promo-card{
    background:var(--blue); color:#fff;
    border-radius:28px; padding:24px 22px 30px;
    margin-bottom:18px;
  }
  .top-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  .logo{ height:28px; display:block; }
  .booth-code{ font-size:24px; font-weight:800; letter-spacing:0.3px; }

  .promo-headline{
    font-size:58px; font-weight:900; line-height:0.95;
    letter-spacing:-1px; margin:0 0 2px;
  }
  .promo-subtitle{
    font-size:30px; font-weight:800; line-height:1.1;
    margin:0;
  }

  .map-card{
    border-radius:20px; overflow:hidden; margin-bottom:22px;
    background:#fff; position:relative;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    border:1px solid #eee;
  }
  .map-wrap{
    position:relative; width:100%; aspect-ratio:1000/294;
    overflow:hidden; touch-action:none; background:#fafaf8;
  }
  .map-stage{
    position:absolute; top:0; left:0; width:100%; height:100%;
    transform-origin:0 0; will-change:transform;
  }
  .map-stage img{ display:block; width:100%; height:100%; object-fit:cover; }
  .map-stage svg{ position:absolute; top:0; left:0; width:100%; height:100%; }

  .route{
    fill:none; stroke:#ffd23f; stroke-width:10;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:4 20; animation: march 1s linear infinite;
    filter: drop-shadow(0 0 2px rgba(0,0,0,0.55));
  }
  @keyframes march{ to { stroke-dashoffset:-24; } }

  .you-ring{ fill:none; stroke:var(--blue); stroke-width:4; animation: ring 1.6s ease-out infinite; }
  @keyframes ring{ 0%{ transform:scale(0.4); opacity:0.9; } 100%{ transform:scale(3.2); opacity:0; } }
  .you-dot{ fill:var(--blue); stroke:#fff; stroke-width:3; }
  .booth-star{ fill:#1a8a5e; stroke:#fff; stroke-width:3; }
  .step-badge{ fill:var(--blue); stroke:#fff; stroke-width:3; }
  .step-badge-num{
    fill:#fff; font-family:Arial, sans-serif; font-weight:800;
    font-size:15px; text-anchor:middle; dominant-baseline:central;
  }

  .zoom-ctrl{ position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:6px; z-index:5; }
  .zoom-ctrl button{
    width:40px; height:40px; border-radius:12px; border:none;
    background:var(--blue); color:#fff; font-size:22px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
  }

  .distance-block{ text-align:center; margin-bottom:24px; }
  .distance-block .dist-row{
    display:flex; align-items:baseline; justify-content:center; gap:10px;
  }
  .distance-block .dist-num{ font-size:72px; font-weight:900; line-height:1; letter-spacing:-1px; color:var(--blue); }
  .distance-block .dist-unit{ font-size:28px; font-weight:800; letter-spacing:0.5px; color:var(--blue); }
  .distance-block .dist-sub{ font-size:17px; font-weight:600; color:#8b8b9a; margin-top:4px; }

  .steps{ display:flex; flex-direction:column; gap:14px; }
  .step{
    display:flex; align-items:center; gap:16px;
    background:var(--beige); border-radius:999px;
    padding:16px 22px; color:var(--ink);
  }
  .step-num{ font-size:22px; font-weight:900; flex-shrink:0; width:20px; color:var(--blue); }
  .step-txt{ font-size:18px; font-weight:700; line-height:1.3; }

  .state-msg{ text-align:center; padding:60px 20px; font-size:16px; color:#8b8b9a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="promo-card">
    <div class="top-row">
      <img class="logo" src="https://i.ibb.co.com/Cp4cqYvX/Elitech-white.png" alt="Elitech"/>
      <div class="booth-code" id="boothCode">&nbsp;</div>
    </div>
    <div class="promo-headline" id="promoHeadline">FREE</div>
    <div class="promo-subtitle" id="promoSubtitle">Medical Check Up</div>
  </div>

  <div id="content" style="display:none;">
    <div class="map-card">
      <div class="map-wrap" id="mapWrap">
        <div class="map-stage" id="mapStage">
          <img id="mapImg" src="" alt="Denah menuju booth"/>
          <svg id="mapSvg" viewBox="0 0 1000 294" preserveAspectRatio="xMidYMid slice"></svg>
        </div>
        <div class="zoom-ctrl">
          <button id="zoomIn" aria-label="Perbesar">+</button>
          <button id="zoomOut" aria-label="Perkecil">&minus;</button>
        </div>
      </div>
    </div>

    <div class="distance-block">
      <div class="dist-row">
        <span class="dist-num" id="distNum">60</span><span class="dist-unit">METER</span>
      </div>
      <div class="dist-sub" id="distSub">Jalan santai &asymp; 2 menit</div>
    </div>

    <div class="steps" id="stepsList"></div>
  </div>

  <div id="loadingMsg" class="state-msg">Menyiapkan peta rute&hellip;</div>
  <div id="errorMsg" class="state-msg" style="display:none;"></div>
</div>

<script>
// =====================================================================
// GANTI dengan URL Web App Apps Script Anda setelah proses Deploy
// =====================================================================
var API_URL = "https://script.google.com/macros/s/AKfycbzI9T6KI8GlxogmhfSc6X8hPgS1_ZYPrKmVhvE5r2NqVWvqOZpx4oTB7355RB-PzFW9fw/exec";
var ASSET_PATH = "assets/"; // folder gambar denah, relatif terhadap file HTML ini

// Data cadangan (dipakai kalau API_URL belum diisi / gagal fetch) supaya
// halaman tetap bisa dites tanpa harus Apps Script sudah jadi.
var FALLBACK = {
  "ENTR-H5|7193-A": {
    titik: { id_titik:"ENTR-H5", nama_titik:"Entrance Gate Hall 5" },
    booth: { kode_booth:"7193-A", hall:"Hall 7", nama_perusahaan:"Elitech" },
    rute: {
      waypoints: [{x:141,y:168},{x:141,y:103},{x:847,y:103},{x:847,y:129}],
      jarak_meter:60, estimasi_menit:2, gambar:"ENTR-H5.png"
    },
    langkah: [
      "Dari Entrance Gate Hall 5, lurus menyusuri lorong utama",
      "Lanjut lurus melewati deretan booth Taiwan/China",
      "Booth 7193-A (Elitech) ada di sisi kanan, Hall 7"
    ]
  },
  "ENTR-H9|7193-A": {
    titik: { id_titik:"ENTR-H9", nama_titik:"Entrance Gate Hall 9" },
    booth: { kode_booth:"7193-A", hall:"Hall 7", nama_perusahaan:"Elitech" },
    rute: {
      waypoints: [{x:670,y:174},{x:670,y:103},{x:82,y:103},{x:82,y:129}],
      jarak_meter:55, estimasi_menit:2, gambar:"ENTR-H9.png"
    },
    langkah: [
      "Dari Entrance Gate Hall 9, lurus menyusuri lorong utama",
      "Lanjut lurus melewati deretan booth Korea/China",
      "Booth 7193-A (Elitech) ada di sisi kiri, Hall 7"
    ]
  }
};

function qs(name){
  var m = new URLSearchParams(window.location.search).get(name);
  return m;
}

function resolveImg(gambar){
  // kalau kolom 'gambar' di sheet sudah berupa URL penuh (mis. link Google Drive),
  // pakai langsung. Kalau cuma nama file, gabung dengan folder assets/ lokal.
  if (/^https?:\/\//i.test(gambar)) return gambar;
  return ASSET_PATH + gambar;
}

function render(data){
  document.getElementById('boothCode').textContent = data.booth.kode_booth;
  // promo_headline / promo_subtitle bisa ditambahkan sebagai kolom opsional
  // di sheet Booth. Kalau tidak ada, pakai teks default di bawah ini.
  document.getElementById('promoHeadline').textContent = data.booth.promo_headline || 'FREE';
  document.getElementById('promoSubtitle').textContent = data.booth.promo_subtitle || 'Medical Check Up';

  document.getElementById('distNum').textContent = data.rute.jarak_meter;
  document.getElementById('distSub').textContent = "Jalan santai \u2248 " + data.rute.estimasi_menit + " menit";
  document.getElementById('mapImg').src = resolveImg(data.rute.gambar);

  var wp = data.rute.waypoints;
  var d = "M " + wp[0].x + " " + wp[0].y;
  for (var i = 1; i < wp.length; i++) d += " L " + wp[i].x + " " + wp[i].y;

  var start = wp[0];
  var turn = wp[wp.length - 2];
  var booth = wp[wp.length - 1];
  var lastBadgeX = turn.x + (turn.x < booth.x ? 43 : -43);

  var svg = document.getElementById('mapSvg');
  svg.innerHTML =
    '<path class="route" d="' + d + '"/>' +
    '<circle class="you-ring" cx="' + start.x + '" cy="' + start.y + '" r="10" style="transform-origin:' + start.x + 'px ' + start.y + 'px"/>' +
    '<circle class="you-dot" cx="' + start.x + '" cy="' + start.y + '" r="9"/>' +
    '<circle class="step-badge" cx="' + start.x + '" cy="' + start.y + '" r="13"/>' +
    '<text class="step-badge-num" x="' + start.x + '" y="' + start.y + '">1</text>' +
    '<circle class="step-badge" cx="' + turn.x + '" cy="' + turn.y + '" r="13"/>' +
    '<text class="step-badge-num" x="' + turn.x + '" y="' + turn.y + '">2</text>' +
    '<circle class="booth-star" cx="' + booth.x + '" cy="' + booth.y + '" r="10"/>' +
    '<circle class="step-badge" cx="' + lastBadgeX + '" cy="' + turn.y + '" r="13"/>' +
    '<text class="step-badge-num" x="' + lastBadgeX + '" y="' + turn.y + '">3</text>';

  var stepsList = document.getElementById('stepsList');
  stepsList.innerHTML = "";
  data.langkah.forEach(function(txt, idx){
    var el = document.createElement('div');
    el.className = 'step';
    el.innerHTML = '<div class="step-num">' + (idx+1) + '</div><div class="step-txt">' + txt + '</div>';
    stepsList.appendChild(el);
  });

  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  initZoom();
}

function showError(msg){
  document.getElementById('loadingMsg').style.display = 'none';
  var e = document.getElementById('errorMsg');
  e.textContent = msg;
  e.style.display = 'block';
}

function boot(){
  var titik = qs('titik') || 'ENTR-H5';
  var booth = qs('booth') || '7193-A';
  var key = titik + '|' + booth;

  if (!API_URL || API_URL.indexOf('GANTI_DENGAN') === 0) {
    if (FALLBACK[key]) { render(FALLBACK[key]); }
    else { showError('Rute untuk titik "' + titik + '" belum tersedia.'); }
    return;
  }

  fetch(API_URL + '?titik=' + encodeURIComponent(titik) + '&booth=' + encodeURIComponent(booth))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.error) { showError(data.error); return; }
      render(data);
    })
    .catch(function(){
      if (FALLBACK[key]) { render(FALLBACK[key]); }
      else { showError('Gagal memuat data rute. Periksa koneksi internet.'); }
    });
}

function initZoom(){
  var wrap = document.getElementById('mapWrap');
  var stage = document.getElementById('mapStage');
  var scale = 1, minScale = 1, maxScale = 4;
  var panX = 0, panY = 0;
  var lastDist = null, dragging = false, lastX = 0, lastY = 0;

  function apply(){ stage.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')'; }
  function clamp(){
    var r = wrap.getBoundingClientRect();
    var maxX = (r.width * (scale - 1)) / 2 + 30;
    var maxY = (r.height * (scale - 1)) / 2 + 30;
    panX = Math.max(-maxX, Math.min(maxX, panX));
    panY = Math.max(-maxY, Math.min(maxY, panY));
  }
  function dist(a, b){ return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
  function setScale(s){
    scale = Math.max(minScale, Math.min(maxScale, s));
    if (scale === 1) { panX = 0; panY = 0; }
    clamp(); apply();
  }

  wrap.addEventListener('touchstart', function(e){
    if (e.touches.length === 2) { lastDist = dist(e.touches[0], e.touches[1]); }
    else if (e.touches.length === 1) { dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
  }, {passive:true});

  wrap.addEventListener('touchmove', function(e){
    if (e.touches.length === 2) {
      e.preventDefault();
      var d = dist(e.touches[0], e.touches[1]);
      if (lastDist) setScale(scale * (d / lastDist));
      lastDist = d;
    } else if (e.touches.length === 1 && dragging && scale > 1) {
      e.preventDefault();
      var dx = e.touches[0].clientX - lastX;
      var dy = e.touches[0].clientY - lastY;
      panX += dx; panY += dy;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      clamp(); apply();
    }
  }, {passive:false});

  wrap.addEventListener('touchend', function(e){
    if (e.touches.length < 2) lastDist = null;
    if (e.touches.length === 0) dragging = false;
  });

  document.getElementById('zoomIn').onclick = function(){ setScale(scale + 0.5); };
  document.getElementById('zoomOut').onclick = function(){ setScale(scale - 0.5); };
}

boot();
</script>
</body>
</html>
